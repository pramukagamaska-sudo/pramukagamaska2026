<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Dewan Ambalan Gamaska 2026">
  <title>Dewan Ambalan Gamaska 2026</title>
  <style>
    :root { --forest: #102b20; --cream: #fff8e9; --gold: #f5c542; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    a { color: inherit; text-decoration: none; }
    .page {
      position: relative;
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      place-items: center;
      overflow: hidden;
      background: url("WhatsApp Image 2026-08-22 at 19.47.26.jpeg") center / cover no-repeat;
    }
    .page::before { position: absolute; inset: 0; content: ""; background: linear-gradient(90deg, rgba(8, 29, 19, .86), rgba(8, 29, 19, .32)); }
    .shell { position: relative; z-index: 1; display: flex; min-height: 100vh; min-height: 100svh; flex-direction: column; width: min(1200px, calc(100% - 48px)); margin: auto; }
    header { display: flex; min-height: 86px; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255, 248, 233, .32); }
    .brand { display: flex; align-items: center; gap: 11px; font: 700 13px/1.2 Arial, sans-serif; letter-spacing: .08em; text-transform: uppercase; }
    .brand-mark { display: grid; width: 34px; height: 34px; place-items: center; border: 1px solid var(--gold); color: var(--gold); font: 700 12px Arial, sans-serif; transform: rotate(45deg); }
    .brand-mark span { transform: rotate(-45deg); }
    .nav { display: flex; align-items: center; gap: clamp(16px, 3vw, 38px); font: 600 11px Arial, sans-serif; letter-spacing: .08em; }
    .nav a { transition: color .2s ease; }
    .nav a:hover, .nav a:focus-visible { color: var(--gold); }
    .hero { display: flex; flex: 1; align-items: end; padding: 100px 0 72px; }
    .hero-copy { max-width: 760px; animation: reveal .8s ease-out both; }
    .eyebrow { margin: 0 0 22px; color: var(--gold); font: 600 11px/1.4 Arial, sans-serif; letter-spacing: .2em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(48px, 8.8vw, 112px); line-height: .9; letter-spacing: .01em; text-transform: uppercase; }
    .hero-footer { display: flex; align-items: end; justify-content: space-between; gap: 30px; margin-top: 36px; }
    .hero-footer p { max-width: 400px; margin: 0; color: rgba(255, 248, 233, .82); font: 15px/1.7 Arial, sans-serif; }
    .scroll-note { color: var(--gold); font: 600 10px/1.5 Arial, sans-serif; letter-spacing: .16em; text-transform: uppercase; white-space: nowrap; }
    .section-anchor { position: absolute; bottom: 0; width: 1px; height: 1px; overflow: hidden; }
    .content {
      position: relative;
      z-index: 1;
      color: var(--forest);
      background: var(--cream);
    }
    .content section { padding: 90px max(24px, calc((100% - 1100px) / 2)); }
    .content section:nth-child(even) { background: #eadfca; }
    .section-label { margin: 0 0 18px; color: #a45828; font: 600 11px Arial, sans-serif; letter-spacing: .18em; text-transform: uppercase; }
    h2 { max-width: 680px; margin: 0 0 32px; font-size: clamp(40px, 7vw, 82px); line-height: .92; letter-spacing: -.02em; }
    .about-grid { display: grid; grid-template-columns: 1.2fr .8fr; gap: 60px; align-items: start; }
    .lead { max-width: 670px; margin: 0; font: 22px/1.45 Arial, sans-serif; }
    .lead strong { color: #a45828; }
    .facts { border-top: 1px solid rgba(16, 43, 32, .25); }
    .fact { display: flex; justify-content: space-between; gap: 20px; padding: 16px 0; border-bottom: 1px solid rgba(16, 43, 32, .25); font: 14px Arial, sans-serif; }
    .fact span { color: #667067; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .card { min-height: 230px; padding: 22px; border: 1px solid rgba(16, 43, 32, .25); }
    .card:nth-child(2) { color: var(--cream); background: var(--forest); }
    .card:nth-child(3) { background: var(--gold); }
    .card-number { font: 12px Arial, sans-serif; }
    .card h3 { margin: 72px 0 10px; font-size: 27px; }
    .card p { margin: 0; font: 14px/1.55 Arial, sans-serif; }
    .timeline { max-width: 760px; border-top: 1px solid rgba(16, 43, 32, .25); }
    .event { display: grid; grid-template-columns: 130px 1fr; gap: 24px; padding: 23px 0; border-bottom: 1px solid rgba(16, 43, 32, .25); }
    .event-date { color: #a45828; font: 600 13px Arial, sans-serif; letter-spacing: .12em; }
    .event h3 { margin: 0 0 6px; font-size: 22px; }
    .event p { margin: 0; font: 14px/1.5 Arial, sans-serif; }
    .contact { display: flex; justify-content: space-between; gap: 40px; align-items: end; }
    .menu-wrap {
      position: relative;
      z-index: 1;
      display: flex;
      width: min(390px, calc(100% - 40px));
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .menu-title {
      margin: 0;
      color: var(--cream);
      font: 700 clamp(56px, 12vw, 118px)/.72 Georgia, "Times New Roman", serif;
      letter-spacing: .08em;
      text-align: center;
      text-shadow: 0 5px 24px rgba(0, 0, 0, .68);
      text-transform: uppercase;
    }
    .menu-title .title-top,
    .menu-title .title-main,
    .menu-title span {
      display: block;
      margin-top: 3px;
    }
    .menu-title .title-top {
      margin-top: 0;
      color: var(--gold);
      font: italic 500 .42em/1 Georgia, "Times New Roman", serif;
      letter-spacing: .28em;
    }
    .menu-title .title-main {
      margin-top: 3px;
      color: var(--cream);
      text-shadow: 2px 3px 0 rgba(245, 197, 66, .2), 0 5px 24px rgba(0, 0, 0, .68);
    }
    .menu-title span {
      color: var(--gold);
      font: italic 600 .46em/.9 Arial, Georgia, serif;
      letter-spacing: .34em;
      text-shadow: 0 3px 14px rgba(0, 0, 0, .5);
    }
    .columns {
      display: flex;
      width: 100%;
      flex-direction: column;
      gap: 10px;
    }
    .column {
      display: grid;
      min-height: 78px;
      place-items: center;
      padding: 18px 26px;
      background: rgba(16, 43, 32, .42);
      border: 1px solid rgba(255, 248, 233, .75);
      border-radius: 8px;
      color: var(--cream);
      font: 700 clamp(16px, 2.5vw, 23px)/1.2 Arial, sans-serif;
      letter-spacing: .1em;
      text-align: center;
      box-shadow: 0 8px 22px rgba(0, 0, 0, .22);
      backdrop-filter: blur(3px);
      transition: color .25s ease, background .25s ease, transform .25s ease;
    }
    .column:hover, .column:focus-visible {
      color: var(--forest);
      background: var(--gold);
      transform: translateX(8px);
      outline: 0;
    }
    @media (max-width: 640px) {
      .menu-wrap { width: min(360px, calc(100% - 24px)); }
      .column { min-height: 74px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="menu-wrap">
      <h1 class="menu-title"><span class="title-top">Dewan</span><span class="title-main">Gamaska</span><span>2026</span></h1>
      <nav class="columns" aria-label="Menu utama">
        <a class="column" href="memory.html">MEMORY</a>
        <a class="column" href="anggota.html">ANGGOTA</a>
        <a class="column" href="prestasi.html">PRESTASI</a>
        <a class="column" href="dokumentasi.html">DOKUMENTASI</a>
        <a class="column" href="media-sosial.html">MEDIA SOSIAL</a>
      </nav>
    </div>
  </main>
</body>
</html>
