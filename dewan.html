<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Dewan Ambalan Gamaska 2026">
  <title>Dewan Ambalan Gamaska 2026</title>
  <style>
    :root {
      --cream: #fff7e8;
      --gold: #f5c542;
      --ink: #1d271d;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
      color: var(--cream);
      font-family: Georgia, "Times New Roman", serif;
      background: var(--ink);
    }

    .opening {
      position: relative;
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      place-items: center;
      isolation: isolate;
      overflow: hidden;
      background: url("WhatsApp Image 2026-08-22 at 19.47.26.jpeg") center center / cover no-repeat;
    }

    .opening::after {
      position: absolute;
      inset: 0;
      z-index: -1;
      content: "";
      background: linear-gradient(180deg, rgba(10, 28, 18, .28), rgba(10, 28, 18, .58));
    }

    .content {
      width: min(900px, calc(100% - 40px));
      padding: 32px 0;
      text-align: center;
      text-shadow: 0 2px 20px rgba(0, 0, 0, .42);
      animation: appear .9s ease-out both;
    }

    h1 {
      max-width: 1000px;
      margin: 0 auto;
      font-size: clamp(48px, 10vw, 128px);
      line-height: .9;
      letter-spacing: .015em;
      text-transform: uppercase;
    }

    .enter-button {
      display: block;
      width: min(420px, 100%);
      margin: 42px auto 0;
      padding: 20px 28px;
      border: 1px solid var(--gold);
      color: var(--cream);
      background: rgba(29, 39, 29, .35);
      font: 700 15px/1 Arial, sans-serif;
      letter-spacing: .2em;
      text-transform: uppercase;
      transition: color .2s ease, background .2s ease, transform .2s ease;
    }

    .enter-button:hover,
    .enter-button:focus-visible {
      color: var(--ink);
      background: var(--gold);
      transform: translateY(-2px);
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 560px) {
      .content { width: min(100% - 28px, 420px); }
      h1 { font-size: clamp(42px, 13vw, 70px); }
      .enter-button { margin-top: 32px; }
    }
  </style>
</head>
<body>
  <main class="opening" id="top">
    <div class="content">
      <h1>Dewan Ambalan Gamaska</h1>
      <a class="enter-button" href="./menu.html">Masuk</a>
    </div>
  </main>
</body>
</html>
