<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dokumentasi - Dewan Ambalan Gamaska</title>
  <style>
    :root { --forest: #102b20; --cream: #fff8e9; --gold: #f5c542; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: var(--cream);
      background: var(--forest) url("WhatsApp Image 2026-08-22 at 19.47.26.jpeg") center / cover fixed;
    }
    .page {
      min-height: 100vh;
      padding: 28px 18px 40px;
      background: rgba(8, 29, 19, .72);
    }
    .container {
      width: min(1100px, 100%);
      margin: 0 auto;
      padding: 28px 20px 32px;
      border: 1px solid rgba(255, 248, 233, .4);
      background: rgba(16, 43, 32, .45);
      backdrop-filter: blur(2px);
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }
    h1 {
      margin: 0;
      color: var(--gold);
      font: 700 clamp(30px, 5vw, 56px)/.95 Georgia, serif;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .back {
      color: var(--cream);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .12em;
      text-decoration: none;
      text-transform: uppercase;
    }
    .role-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
      width: min(1100px, 100%);
      margin: 0 auto 28px;
    }
    .role-card {
      display: grid;
      place-items: center;
      min-height: 150px;
      padding: 24px 18px;
      border: 1px solid rgba(255, 248, 233, .32);
      background: rgba(16, 43, 32, .72);
      box-shadow: 0 10px 22px rgba(0, 0, 0, .18);
      text-align: center;
      background-position: center;
      background-size: cover;
      color: inherit;
      text-decoration: none;
      cursor: pointer;
    }
    .role-card:nth-child(1) {
      background-image: linear-gradient(rgba(16, 43, 32, .45), rgba(16, 43, 32, .45)), url("BANTARA.JPG");
    }
    .role-card:nth-child(2) {
      background-image: linear-gradient(rgba(16, 43, 32, .45), rgba(16, 43, 32, .45)), url("SUSUR PANTAI.jpeg");
    }
    .role-card:nth-child(3) {
      background-image: linear-gradient(rgba(16, 43, 32, .45), rgba(16, 43, 32, .45)), url("KPTA.JPG");
    }
    .role-card:nth-child(4) {
      background-image: linear-gradient(rgba(16, 43, 32, .45), rgba(16, 43, 32, .45)), url("LAKSANA.JPG");
    }
    .role-card h2 {
      margin: 0;
      color: var(--cream);
      font-size: clamp(28px, 4vw, 42px);
      letter-spacing: .08em;
      text-transform: uppercase;
      -webkit-text-stroke: 2.5px var(--gold);
      paint-order: stroke fill;
      text-shadow: 0 0 8px rgba(245, 197, 66, .9), 0 0 18px rgba(245, 197, 66, .65);
    }
    @media (max-width: 640px) {
      .topbar { flex-direction: column; align-items: flex-start; }
      .role-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="container">
      <div class="topbar">
        <h1>Dokumentasi</h1>
        <a class="back" href="menu.html">Kembali ke menu</a>
      </div>
      <section class="role-grid" aria-label="Kolom utama organisasi">
        <a class="role-card" href="https://drive.google.com/drive/folders/1ph1x_SMdEHsEaeXpYEolzLRz63O1Tw_7?usp=drive_link" target="_blank" rel="noopener noreferrer"><h2>BANTARA</h2></a>
        <a class="role-card" href="https://drive.google.com/drive/folders/193K5lInHHd0B9nTkKH-oycMD28M4Eyqn?usp=drive_link" target="_blank" rel="noopener noreferrer"><h2>SUSUR PANTAI</h2></a>
        <a class="role-card" href="https://drive.google.com/drive/folders/1dnO5EJvIkEkvuoLYfkYEkB0_ZXBVJt6e?usp=drive_link" target="_blank" rel="noopener noreferrer"><h2>KPTA</h2></a>
        <a class="role-card" href="https://drive.google.com/drive/folders/1xTeb30r6ZIADnlips5fanqvBawO5WumU?usp=drive_link" target="_blank" rel="noopener noreferrer"><h2>LAKSANA</h2></a>
      </section>
    </div>
  </main>
</body>
</html>
