    .photo img { display: block; width: 100%; height: 100%; object-fit: cover; content-visibility: auto; }
    .caption { position: absolute; right: 0; bottom: 0; left: 0; padding: 12px 14px; color: var(--cream); background: linear-gradient(transparent, rgba(8, 29, 19, .8)); font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; }
    .lightbox-download { position: absolute; z-index: 3; display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border: none; border-radius: 50%; font-size: 18px; font-weight: 700; text-decoration: none; color: #102b20; background: rgba(255,255,255,.92); box-shadow: 0 10px 20px rgba(0,0,0,.18); cursor: pointer; transition: transform .2s ease, opacity .2s ease; top: 14px; right: 14px; }
    .lightbox-download:hover { transform: translateY(-1px); }
    .lightbox { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(6, 15, 12, .82); backdrop-filter: blur(4px); z-index: 999; padding: 24px; }
    .lightbox.open { display: flex; animation: fadeIn .22s ease; }
    .audio-player { display: block; width: min(420px, calc(100vw - 28px)); margin: 12px auto 0; border-radius: 12px; background: rgba(8, 29, 19, .7); }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .lightbox-inner { position: relative; max-width: min(90vw, 980px); width: 100%; padding: 16px; border-radius: 18px; background: rgba(18, 34, 28, .9); box-shadow: 0 20px 60px rgba(0,0,0,.42); border: 1px solid rgba(255,255,255,.08); }
    .lightbox img { display: block; width: 100%; max-height: 82vh; object-fit: contain; border-radius: 12px; background: #000; border: 1px solid rgba(255,255,255,.12); }
    .lightbox-close, .lightbox-prev, .lightbox-next { position: absolute; width: 42px; height: 42px; border: none; border-radius: 50%; display: grid; place-items: center; cursor: pointer; color: #fff; background: rgba(255,255,255,.12); box-shadow: 0 10px 20px rgba(0,0,0,.16); transition: transform .2s ease, background .2s ease; }
    .lightbox-close:hover, .lightbox-prev:hover, .lightbox-next:hover { transform: scale(1.04); background: rgba(255,255,255,.18); }
    .lightbox-close { top: -12px; right: -12px; font-size: 26px; line-height: 1; }
    .lightbox-prev, .lightbox-next { top: 50%; transform: translateY(-50%); font-size: 28px; }
    .lightbox-prev { left: -16px; }
    .lightbox-next { right: -16px; }
    @media (max-width: 900px) { .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 640px) { header { align-items: flex-start; flex-direction: column; margin: 0 12px 10px; } .gallery { grid-template-columns: minmax(0, 1fr); width: calc(100vw - 26px); gap: 12px; } .photo img { height: 220px; } .caption { padding: 10px; font-size: 9px; } .lightbox { padding: 18px; } .lightbox-inner { padding: 10px; } .lightbox-prev, .lightbox-next { width: 38px; height: 38px; } }

  <div class="lightbox" id="lightbox" aria-hidden="true">

  <script>
    const pageMusic = document.getElementById('page-music');
    const tryPlayMusic = () => {
      if (pageMusic && typeof pageMusic.play === 'function') {
        pageMusic.play().catch(() => {});
      }
    };
    document.addEventListener('pointerdown', tryPlayMusic, { once: true });
    document.addEventListener('keydown', tryPlayMusic, { once: true });

    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const closeBtn = document.querySelector('.lightbox-close');
    const prevBtn = document.querySelector('.lightbox-prev');
    const nextBtn = document.querySelector('.lightbox-next');
    const downloadBtn = document.querySelector('.lightbox-download');
    const figures = Array.from(document.querySelectorAll('.photo'));
    const images = figures.map((figure) => figure.querySelector('img'));
    let currentIndex = 0;

    images.forEach((image, index) => {
      image.decoding = 'async';
      if (index > 3) image.loading = 'lazy';
    });

    const openLightbox = (index) => {
      currentIndex = index;
      const img = images[currentIndex];
      lightboxImg.src = img.src;
      lightboxImg.alt = img.alt;
      lightbox.classList.add('open');
      lightbox.setAttribute('aria-hidden', 'false');
    };

    const closeLightbox = () => {
      lightbox.classList.remove('open');
      lightbox.setAttribute('aria-hidden', 'true');
    };

    const showPrev = () => {
      const next = (currentIndex - 1 + images.length) % images.length;
      openLightbox(next);
    };

    const showNext = () => {
      const next = (currentIndex + 1) % images.length;
      openLightbox(next);
    };

    const triggerDownload = () => {
      const currentImg = images[currentIndex];
      const link = document.createElement('a');
      link.href = currentImg.src;
      link.download = currentImg.getAttribute('src').split('/').pop();
      document.body.appendChild(link);
      link.click();
      link.remove();
    };

    figures.forEach((figure, index) => {
      figure.addEventListener('click', () => openLightbox(index));
    });

    closeBtn.addEventListener('click', closeLightbox);
    prevBtn.addEventListener('click', showPrev);
    nextBtn.addEventListener('click', showNext);
    downloadBtn.addEventListener('click', triggerDownload);

    lightbox.addEventListener('click', (event) => {
      if (event.target === lightbox) closeLightbox();
    });

    document.addEventListener('keydown', (event) => {
      if (!lightbox.classList.contains('open')) return;
      if (event.key === 'Escape') closeLightbox();
      if (event.key === 'ArrowLeft') showPrev();
      if (event.key === 'ArrowRight') showNext();
      if (event.key.toLowerCase() === 'd') triggerDownload();
    });
  </script>
